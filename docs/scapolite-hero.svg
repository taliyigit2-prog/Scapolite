<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Scapolite</title>
  <desc id="description">AI usage, sessions, Mac health, and service status in one menu bar cockpit.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#151536"/>
      <stop offset="1" stop-color="#082c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="32" fill="url(#background)"/>
  <circle cx="1060" cy="70" r="170" fill="#2dd4bf" opacity=".07"/>
  <circle cx="130" cy="390" r="220" fill="#8b5cf6" opacity=".08"/>
  <g transform="translate(82 68)">
    <rect x="0" y="0" width="1036" height="42" rx="21" fill="#050713" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="34" cy="21" r="7" fill="#2dd4bf" filter="url(#glow)"/>
    <rect x="58" y="15" width="112" height="12" rx="6" fill="#ffffff" opacity=".22"/>
    <g transform="translate(704 9)">
      <rect width="76" height="24" rx="12" fill="#8b5cf6" opacity=".32"/>
      <rect x="88" width="76" height="24" rx="12" fill="#3b82f6" opacity=".32"/>
      <rect x="176" width="76" height="24" rx="12" fill="#14b8a6" opacity=".32"/>
    </g>
  </g>
  <g transform="translate(82 156)">
    <text x="0" y="68" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="76" font-weight="750" letter-spacing="-2">Scapolite</text>
    <rect x="0" y="92" width="500" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="142" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24">Your AI cockpit, one click from the Mac menu bar.</text>
  </g>
  <g transform="translate(735 165)" fill="none" stroke-linecap="round">
    <path d="M0 105 C45 105 50 20 92 20 S145 160 190 160 235 65 280 65" stroke="#ffffff" stroke-opacity=".12" stroke-width="22"/>
    <path d="M0 105 C45 105 50 20 92 20 S145 160 190 160 235 65 280 65" stroke="url(#accent)" stroke-width="7" filter="url(#glow)"/>
    <circle cx="92" cy="20" r="8" fill="#60a5fa" stroke="none"/>
    <circle cx="190" cy="160" r="8" fill="#a78bfa" stroke="none"/>
    <circle cx="280" cy="65" r="8" fill="#2dd4bf" stroke="none"/>
  </g>
</svg>
